name: Build Dungeon Mod
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 生成Gradle全局镜像脚本（不修改build.gradle）
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  def aliyunPublic = maven { url "https://maven.aliyun.com/repository/public" }
                  def aliyunPlugin = maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
                  def neoMaven = maven { url "https://maven.neoforged.net" }
                  removeAll(repositories)
                  repositories {
                      aliyunPublic
                      aliyunPlugin
                      mavenCentral()
                      neoMaven
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod
        run: ./gradlew build --stacktrace
        env:
          GRADLE_OPTS: "-Dhttp.connectionTimeout=45000 -Dhttp.readTimeout=90000"

      - name: Remove source & javadoc jars
        run: |
          rm -f build/libs/*-sources.jar
          rm -f build/libs/*-javadoc.jar

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Mod
          path: build/libs/*.jar
