name: Build Mod
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system Gradle
        run: apt update && apt install -y gradle

      # 全局gradle生成wrapper，不需要项目自带wrapper.jar
      - name: Generate wrapper
        run: gradle wrapper --gradle-version=8.14.3

      - name: chmod gradlew
        run: chmod +x gradlew

      # 阿里云Maven镜像
      - name: Gradle mirror
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
}
EOF

      - name: genSources
        run: ./gradlew genSources

      - name: build jar
        run: ./gradlew jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModJar
          path: build/libs/*.jar
