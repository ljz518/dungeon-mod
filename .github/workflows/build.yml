name: Build Forge1.20.1 Mod
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5.1'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version=7.5.1 --no-daemon

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Gradle mirror
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/minecraftforge' }
        mavenCentral()
    }
}
EOF

      - name: Run genSources
        run: ./gradlew genSources --no-daemon

      - name: Build Jar
        run: ./gradlew jar --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModJar
          path: build/libs/*.jar

