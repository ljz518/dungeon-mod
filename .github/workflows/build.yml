name: Build Mod
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 阿里云镜像加速
        run: |
          mkdir -p ~/.gradle
          echo "allprojects{repositories{maven{url 'https://maven.aliyun.com/repository/public'}mavenCentral()}}" > ~/.gradle/init.gradle

      - name: Run genSources
        run: gradle genSources

      # 重点：只用jar任务，只打包模组，不做额外校验
      - name: Package Mod Jar
        run: gradle jar

      - name: Upload compiled jar
        uses: actions/upload-artifact@v4
        with:
          name: ModJar
          path: build/libs/*.jar


