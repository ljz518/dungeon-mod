name: Build Forge1.20.1 Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle (CI全局)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Generate Gradle Wrapper on CI
        run: gradle wrapper --gradle-version=8.1.1

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Clean auxiliary jars
        run: |
          rm -f build/libs/*-sources.jar
          rm -f build/libs/*-javadoc.jar

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: ModJar
          path: build/libs/*.jar
